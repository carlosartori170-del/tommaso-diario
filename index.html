<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tommaso — Diario di crescita</title>
<style>
  :root{
    --paper:#FAF3EA; --ink:#2B3A42; --line:#EFE6D6; --line2:#E7DBC9;
    --gold:#B08A5A; --amber:#D9A441; --clay:#C1694F; --sage:#6E8B74;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:Georgia,'Iowan Old Style',serif;}
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  button{cursor:pointer; font-family:inherit;}
  header{padding:28px 20px 18px; border-bottom:1px solid var(--line2);}
  .headwrap{max-width:640px; margin:0 auto;}
  .eyebrow{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold);}
  h1{margin:2px 0 0; font-size:30px; font-weight:600;}
  .tabs{display:flex; justify-content:center; gap:6px; padding:16px 20px 0;}
  .tab{display:flex; align-items:center; gap:6px; padding:9px 18px; border-radius:999px;
    border:1px solid var(--line2); background:transparent; color:var(--ink); font-size:14px; font-weight:600;}
  .tab.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  main{max-width:640px; margin:0 auto; padding:24px 20px 60px;}
  .navrow{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .navbtn{background:none; border:none; color:var(--gold); font-size:20px; padding:4px 8px;}
  .navbtn:disabled{color:var(--line2);}
  .daylabel{font-size:17px; font-weight:600; text-transform:capitalize; text-align:center;}
  .daysub{font-size:12px; color:#8A7A61; text-align:center;}
  .toast{background:#EFE4CC; border:1px solid var(--amber); color:#6B5320; padding:10px 14px; border-radius:10px; font-size:13.5px; margin-bottom:16px;}
  .ringwrap{display:flex; justify-content:center;}
  .remaining{text-align:center; margin:14px 0 22px; font-size:14px;}
  .card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:20px;}
  .cardtitle{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:10px;}
  .formrow{display:flex; gap:8px; flex-wrap:wrap;}
  .formrow input{border:1px solid var(--line2); border-radius:10px; padding:9px 10px; font-size:13px; flex:1 1 140px;}
  .btn-add{background:var(--ink); color:#fff; border:none; border-radius:10px; padding:9px 16px; font-size:13px; font-weight:600;}
  .entry, .histitem{background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 14px;
    display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .entrytime, .histdate{font-size:13px; color:#8A7A61;}
  .histdate{text-transform:capitalize;}
  .btn-rm{background:none; border:none; color:var(--clay); font-size:16px;}
  .empty{color:#8A7A61; font-size:13px;}
  .goalinputs{display:flex; gap:10px; flex-wrap:wrap;}
  .goalinputs label{font-size:12.5px; color:#8A7A61;}
  .goalinputs input{display:block; margin-top:4px; border:1px solid var(--line2); border-radius:10px; padding:8px 10px; font-size:13px; width:100px;}
  .goalnote{font-size:12px; color:#8A7A61; margin-top:8px;}
</style>
</head>
<body>
<header>
  <div class="headwrap">
    <div class="eyebrow sans">Diario di crescita</div>
    <h1>Tommaso</h1>
  </div>
</header>

<div class="tabs sans">
  <button class="tab active" id="tabPasti" onclick="setTab('pasti')">🍼 Poppate</button>
  <button class="tab" id="tabCrescita" onclick="setTab('crescita')">⚖️ Crescita</button>
</div>

<main>
  <div id="viewPasti"></div>
  <div id="viewCrescita" style="display:none"></div>
</main>

<script>
// ---------- storage (localStorage — dati solo su questo dispositivo/browser) ----------
const LS = {
  get(key, fallback){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } },
  set(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
};

const DEFAULT_SETTINGS = { goal: 630, step: 70, unit: "ml" };
let settings = LS.get("settings", DEFAULT_SETTINGS);
let dayIndex = LS.get("dayIndex", []);
let weights = LS.get("weights", []);
let dayKey = todayKey();
let toastMsg = "";
let tab = "pasti";

function todayKey(d){ d = d || new Date(); const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0"); return `${y}-${m}-${day}`; }
function prettyDate(key){ return new Date(key+"T00:00:00").toLocaleDateString("it-IT",{weekday:"long", day:"numeric", month:"long"}); }
function shortDate(key){ return new Date(key+"T00:00:00").toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit"}); }
function shiftDay(key, delta){ const d = new Date(key+"T00:00:00"); d.setDate(d.getDate()+delta); return todayKey(d); }
function nowTime(){ return new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}); }
function loadDayRaw(key){ return LS.get(`day:${key}`, null); }
function saveDay(rec){ LS.set(`day:${rec.date}`, rec); }
function total(rec){ return (rec && rec.entries ? rec.entries : []).reduce((s,e)=>s+e.amount,0); }

function ensureDay(key){
  let rec = loadDayRaw(key);
  if(!rec){
    const prevKey = shiftDay(key, -1);
    const prevRec = loadDayRaw(prevKey);
    if(prevRec){
      const prevTotal = total(prevRec);
      if(prevTotal >= prevRec.goal){
        settings = { ...settings, goal: settings.goal + settings.step };
        LS.set("settings", settings);
        toastMsg = `Obiettivo di ieri raggiunto (${prevTotal} ${settings.unit})! Da oggi l'obiettivo sale a ${settings.goal} ${settings.unit}.`;
      }
    }
    rec = { date: key, goal: settings.goal, entries: [] };
    saveDay(rec);
  }
  if(!dayIndex.includes(key)){ dayIndex = [...dayIndex, key].sort(); LS.set("dayIndex", dayIndex); }
  return rec;
}

let dayRecord = ensureDay(dayKey);

function historyList(){
  return dayIndex.filter(k => k !== dayKey)
    .map(k => loadDayRaw(k)).filter(Boolean)
    .map(r => ({ date: r.date, total: total(r), goal: r.goal }))
    .sort((a,b)=> b.date.localeCompare(a.date));
}

function addEntry(){
  const input = document.getElementById("amountInput");
  const v = parseFloat((input.value||"").replace(",", "."));
  if(isNaN(v) || v <= 0) return;
  dayRecord.entries.push({ id: Date.now().toString(36), time: nowTime(), amount: Math.round(v) });
  saveDay(dayRecord);
  input.value = "";
  render();
}
function removeEntry(id){ dayRecord.entries = dayRecord.entries.filter(e=>e.id!==id); saveDay(dayRecord); render(); }
function goDay(delta){ dayKey = shiftDay(dayKey, delta); dayRecord = ensureDay(dayKey); render(); }

function updateGoalSetting(field, value){
  const v = parseInt(value, 10);
  if(isNaN(v) || v < 0) return;
  settings = { ...settings, [field]: v };
  LS.set("settings", settings);
}

function addWeight(){
  const dateEl = document.getElementById("wDate");
  const gramsEl = document.getElementById("wGrams");
  const g = parseFloat((gramsEl.value||"").replace(",", "."));
  const date = dateEl.value || todayKey();
  if(isNaN(g) || g <= 0) return;
  weights = weights.filter(w => w.date !== date);
  weights.push({ date, grams: Math.round(g) });
  weights.sort((a,b)=> a.date.localeCompare(b.date));
  LS.set("weights", weights);
  gramsEl.value = "";
  render();
}
function removeWeight(date){ weights = weights.filter(w=>w.date!==date); LS.set("weights", weights); render(); }

function setTab(t){ tab = t; render(); }

// ---------- rendering ----------
function renderPasti(){
  const isToday = dayKey === todayKey();
  const currentTotal = total(dayRecord);
  const remaining = Math.max(dayRecord.goal - currentTotal, 0);
  const reached = currentTotal >= dayRecord.goal;
  const pct = Math.min(currentTotal / dayRecord.goal, 1);
  const hist = historyList();

  const size=168, stroke=12, r=(size-stroke)/2, c=2*Math.PI*r, offset = c*(1-pct);
  const ringSvg = `<svg width="${size}" height="${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#EFE6D6" stroke-width="${stroke}" fill="none"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${reached?'#6E8B74':'#D9A441'}" stroke-width="${stroke}" fill="none"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="47%" text-anchor="middle" font-size="26" font-weight="600" fill="#2B3A42" font-family="Georgia, serif">${currentTotal}</text>
    <text x="50%" y="63%" text-anchor="middle" font-size="12" fill="#8A7A61" font-family="-apple-system,sans-serif">di ${dayRecord.goal} ${settings.unit}</text>
  </svg>`;

  let entriesHtml = "";
  [...dayRecord.entries].reverse().forEach(e=>{
    entriesHtml += `<div class="entry">
      <span class="entrytime sans">${e.time}</span>
      <span style="font-weight:600">${e.amount} ${settings.unit}</span>
      <button class="btn-rm sans" onclick="removeEntry('${e.id}')">✕</button>
    </div>`;
  });
  if(dayRecord.entries.length===0) entriesHtml = `<div class="empty sans" style="text-align:center">Nessuna poppata registrata per questo giorno.</div>`;

  let histHtml = "";
  hist.forEach(h=>{
    histHtml += `<div class="histitem">
      <span class="histdate sans">${prettyDate(h.date)}</span>
      <span style="font-weight:600">${h.total} ${settings.unit}</span>
      ${h.total >= h.goal ? `<span style="color:#6E8B74">✓</span>` : `<span class="sans" style="font-size:11px;color:#C1694F">su ${h.goal}</span>`}
    </div>`;
  });
  if(hist.length===0) histHtml = `<div class="empty sans">Nessun giorno precedente registrato.</div>`;

  document.getElementById("viewPasti").innerHTML = `
    <div class="navrow">
      <button class="navbtn" onclick="goDay(-1)">‹</button>
      <div>
        <div class="daylabel">${prettyDate(dayKey)}</div>
        <div class="daysub sans">${isToday ? "Oggi" : ""}</div>
      </div>
      <button class="navbtn" onclick="goDay(1)" ${isToday?"disabled":""}>›</button>
    </div>
    ${toastMsg ? `<div class="toast sans">${toastMsg}</div>` : ""}
    <div class="ringwrap">${ringSvg}</div>
    <div class="remaining sans" style="color:${reached?'#6E8B74':'#8A7A61'}">
      ${reached ? "Obiettivo raggiunto per oggi 🎉" : `Mancano ${remaining} ${settings.unit} all'obiettivo`}
    </div>
    <div class="card">
      <div class="cardtitle sans">Aggiungi poppata</div>
      <div class="formrow">
        <input id="amountInput" class="sans" placeholder="${settings.unit} bevuti" inputmode="decimal" onkeydown="if(event.key==='Enter') addEntry()"/>
        <button class="btn-add sans" onclick="addEntry()">+ Aggiungi</button>
      </div>
    </div>
    ${entriesHtml}
    <div class="card" style="margin-top:24px">
      <div class="cardtitle sans">Obiettivo</div>
      <div class="goalinputs">
        <label class="sans">Obiettivo giornaliero attuale
          <input type="number" value="${settings.goal}" onchange="updateGoalSetting('goal', this.value)"/>
        </label>
        <label class="sans">Incremento a obiettivo raggiunto
          <input type="number" value="${settings.step}" onchange="updateGoalSetting('step', this.value)"/>
        </label>
      </div>
      <div class="goalnote sans">Le modifiche valgono dal prossimo giorno non ancora iniziato.</div>
    </div>
    <div class="cardtitle sans">Storico giornaliero</div>
    ${histHtml}
  `;

  if(toastMsg){ setTimeout(()=>{ toastMsg=""; if(tab==='pasti') renderPasti(); }, 4200); }
}

function renderCrescita(){
  const sorted = [...weights].sort((a,b)=>a.date.localeCompare(b.date));
  let chartHtml;
  if(sorted.length >= 2){
    const w=560, h=200, pad=36;
    const kgs = sorted.map(x=>x.grams/1000);
    const min = Math.min(...kgs), max = Math.max(...kgs);
    const range = (max-min) || 1;
    const stepX = (w - pad*2) / (sorted.length-1);
    const pts = sorted.map((wt,i)=>{
      const x = pad + i*stepX;
      const y = h - pad - ((wt.grams/1000 - min)/range) * (h - pad*2);
      return {x,y,label: shortDate(wt.date)};
    });
    const path = pts.map((p,i)=> (i===0?"M":"L")+p.x.toFixed(1)+","+p.y.toFixed(1)).join(" ");
    let dots = pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="#6E8B74"/>`).join("");
    let labels = pts.map(p=>`<text x="${p.x.toFixed(1)}" y="${h-10}" font-size="10" fill="#8A7A61" text-anchor="middle" font-family="sans-serif">${p.label}</text>`).join("");
    chartHtml = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="220">
      <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#E7DBC9"/>
      <path d="${path}" fill="none" stroke="#6E8B74" stroke-width="2.5"/>
      ${dots}${labels}
    </svg>`;
  } else {
    chartHtml = `<div class="empty sans" style="text-align:center; padding:40px 10px;">Aggiungi almeno due pesate per vedere la curva di crescita.</div>`;
  }

  let hist = "";
  [...weights].reverse().forEach(w=>{
    hist += `<div class="histitem">
      <span class="histdate sans">${prettyDate(w.date)}</span>
      <span style="font-weight:600">${(w.grams/1000).toFixed(3)} kg</span>
      <button class="btn-rm sans" onclick="removeWeight('${w.date}')">−</button>
    </div>`;
  });
  if(weights.length===0) hist = `<div class="empty sans">Nessuna pesata registrata.</div>`;

  document.getElementById("viewCrescita").innerHTML = `
    <div class="card">${chartHtml}</div>
    <div class="card">
      <div class="cardtitle sans">Nuova pesata</div>
      <div class="formrow">
        <input type="date" id="wDate" class="sans" value="${todayKey()}"/>
        <input type="text" id="wGrams" class="sans" placeholder="grammi, es. 3450" inputmode="decimal"/>
        <button class="btn-add sans" onclick="addWeight()">+ Aggiungi</button>
      </div>
    </div>
    <div class="cardtitle sans">Storico</div>
    ${hist}
  `;
}

function render(){
  document.getElementById("tabPasti").className = "tab sans" + (tab==="pasti" ? " active" : "");
  document.getElementById("tabCrescita").className = "tab sans" + (tab==="crescita" ? " active" : "");
  document.getElementById("viewPasti").style.display = tab==="pasti" ? "block" : "none";
  document.getElementById("viewCrescita").style.display = tab==="crescita" ? "block" : "none";
  if(tab==="pasti") renderPasti(); else renderCrescita();
}

render();
</script>
</body>
</html>
